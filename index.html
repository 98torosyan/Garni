<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F1D1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ազատ է · Գառնի</title>
  <meta name="description" content="Ազատ տուն Գառնիում՝ առանց զանգերի։ Свободный дом в Гарни без лишних звонков.">
  <meta property="og:title" content="Ազատ է · Գառնի">
  <meta property="og:description" content="Ազատ տուն Գառնիում՝ առանց զանգերի">
  <meta property="og:image" content="icon-512.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Ազատ է">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ============ FORM ============ -->
  <main id="screen-form" class="screen">
    <header class="hero">
      <img class="hero__img" src="dzor-2.jpg" alt="" fetchpriority="high">
      <div class="hero__bar">
        <a class="brand" href="#" aria-label="Ազատ է">
          <svg class="brand__mark" viewBox="80 120 352 316" aria-hidden="true"><path d="M110 206 256 128 402 206z" fill="#C2643A" stroke="none"/><g fill="currentColor" stroke="none"><rect x="110" y="218" width="292" height="16" rx="3"/><rect x="134" y="246" width="28" height="118" rx="3"/><rect x="190" y="246" width="28" height="118" rx="3"/><rect x="294" y="246" width="28" height="118" rx="3"/><rect x="350" y="246" width="28" height="118" rx="3"/><rect x="110" y="374" width="292" height="14" rx="3"/><rect x="96" y="396" width="320" height="14" rx="3" opacity=".7"/><rect x="82" y="418" width="348" height="14" rx="3" opacity=".4"/></g><path d="M238 294a18 18 0 0 1 36 0v70h-36z" fill="#F0B072" stroke="none"/></svg>
          <span class="brand__name">Ազատ է</span>
        </a>
        <div class="langs" role="group" aria-label="Language">
          <button type="button" data-lang="hy">ՀԱՅ</button>
          <button type="button" data-lang="ru">РУС</button>
          <button type="button" data-lang="en">ENG</button>
        </div>
      </div>
      <div class="hero__copy">
        <p class="hero__place">Գառնի</p>
        <h1 data-i18n="heroTitle"></h1>
        <p data-i18n="heroText"></p>
      </div>
    </header>

    <form id="request-form" class="sheet" novalidate>
      <section class="block">
        <h2 data-i18n="when"></h2>
        <div class="dates">
          <label class="date">
            <span class="date__label" data-i18n="checkIn"></span>
            <span class="date__value" id="checkin-text"></span>
            <input type="date" id="checkin" required>
          </label>
          <label class="date">
            <span class="date__label" data-i18n="checkOut"></span>
            <span class="date__value" id="checkout-text"></span>
            <input type="date" id="checkout" required>
          </label>
        </div>
        <p class="hint" id="nights-text"></p>
      </section>

      <section class="block">
        <h2 data-i18n="guests"></h2>
        <div class="counter">
          <div class="counter__text"><span data-i18n="adults"></span><small data-i18n="adultsHint"></small></div>
          <div class="counter__ctrl">
            <button type="button" class="round" data-step="adults:-1" aria-label="−"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
            <output id="adults-out" aria-live="polite">2</output>
            <button type="button" class="round" data-step="adults:1" aria-label="+"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
          </div>
        </div>
        <div class="counter">
          <div class="counter__text"><span data-i18n="kids"></span><small data-i18n="kidsHint"></small></div>
          <div class="counter__ctrl">
            <button type="button" class="round" data-step="kids:-1" aria-label="−"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
            <output id="kids-out" aria-live="polite">0</output>
            <button type="button" class="round" data-step="kids:1" aria-label="+"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
          </div>
        </div>
      </section>

      <section class="block">
        <h2 data-i18n="who"></h2>
        <div class="choices choices--grid" id="groups"></div>
      </section>

      <section class="block">
        <h2><span data-i18n="wishes"></span> <small data-i18n="optional"></small></h2>
        <div class="choices" id="extras"></div>
      </section>

      <section class="block">
        <h2 data-i18n="contact"></h2>
        <label class="field">
          <span data-i18n="name"></span>
          <input type="text" id="name" autocomplete="given-name" data-i18n-ph="namePh" required>
          <em class="field__err" id="name-err"></em>
        </label>
        <label class="field">
          <span data-i18n="phone"></span>
          <input type="tel" id="phone" autocomplete="tel" inputmode="tel" placeholder="+374 __ ___ ___" required>
          <em class="field__err" id="phone-err"></em>
        </label>
        <p class="privacy">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
          <span data-i18n="privacy"></span>
        </p>
      </section>

      <div class="dock">
        <p class="dock__summary" id="summary"></p>
        <p class="dock__err" id="dates-err" role="alert"></p>
        <button type="submit" class="cta"><span data-i18n="submit"></span></button>
      </div>
    </form>
  </main>

  <!-- ============ RESULTS ============ -->
  <main id="screen-results" class="screen" hidden>
    <div class="topbar">
      <button type="button" class="topbar__back" id="edit-btn">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
        <span data-i18n="editRequest"></span>
      </button>
      <span class="brand brand--small"><svg class="brand__mark" viewBox="80 120 352 316" aria-hidden="true"><path d="M110 206 256 128 402 206z" fill="#C2643A" stroke="none"/><g fill="currentColor" stroke="none"><rect x="110" y="218" width="292" height="16" rx="3"/><rect x="134" y="246" width="28" height="118" rx="3"/><rect x="190" y="246" width="28" height="118" rx="3"/><rect x="294" y="246" width="28" height="118" rx="3"/><rect x="350" y="246" width="28" height="118" rx="3"/><rect x="110" y="374" width="292" height="14" rx="3"/><rect x="96" y="396" width="320" height="14" rx="3" opacity=".7"/><rect x="82" y="418" width="348" height="14" rx="3" opacity=".4"/></g><path d="M238 294a18 18 0 0 1 36 0v70h-36z" fill="#F0B072" stroke="none"/></svg><span class="brand__name">Ազատ է</span></span>
    </div>

    <section class="status" id="status" aria-live="polite">
      <p class="status__state"><span class="dot" id="status-dot"></span><span id="status-state"></span></p>
      <h1 class="status__title" id="status-title"></h1>
      <p class="status__text" id="status-text"></p>
      <div class="status__bar"><i id="status-progress"></i></div>
      <p class="status__meta"><span id="status-time"></span><span id="status-count"></span></p>
    </section>

    <div class="tags" id="req-tags"></div>

    <div class="houses" id="houses"></div>

    <div class="waiting" id="waiting" hidden>
      <div class="waiting__row"><i></i><div><b></b><b></b></div></div>
      <p data-i18n="waiting"></p>
    </div>

    <div class="empty" id="empty" hidden>
      <h2 id="empty-title"></h2>
      <p id="empty-text"></p>
      <button type="button" class="cta cta--ghost" id="again-btn"><span data-i18n="newRequest"></span></button>
    </div>
  </main>

  <!-- ============ SETUP (#setup) ============ -->
  <main id="screen-setup" class="screen setup" hidden>
    <div class="topbar">
      <a class="topbar__back" href="#">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
        <span>Կայք</span>
      </a>
      <span class="setup__title">Կարգավորումներ</span>
    </div>

    <section class="setup__block">
      <h2>Ռեժիմ</h2>
      <p id="setup-mode" class="setup__mode"></p>
    </section>

    <section class="setup__block">
      <h2>Բոտի token</h2>
      <p class="setup__hint">Պահվում է միայն այս հեռախոսում։ GitHub-ում չի հայտնվում։</p>
      <label class="field">
        <span>Token BotFather-ից</span>
        <input type="password" id="token" autocomplete="off" spellcheck="false" placeholder="123456:ABC…">
      </label>
      <div class="setup__row">
        <button type="button" class="btn" id="token-save">Պահել և ստուգել</button>
        <button type="button" class="btn btn--quiet" id="token-clear">Ջնջել</button>
      </div>
      <p class="setup__out" id="token-out" role="status"></p>
    </section>

    <section class="setup__block">
      <h2>Տնատերերի Telegram ID-ներ</h2>
      <p class="setup__hint">Տնատերը նախ պետք է բոտին գրի /start։ Հետո սեղմիր «Գտնել ID-ները»։</p>
      <button type="button" class="btn" id="find-ids">Գտնել ID-ները</button>
      <ul class="setup__found" id="found"></ul>
      <div id="owner-fields"></div>
      <p class="setup__out" id="ids-out" role="status"></p>
    </section>
  </main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="houses.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
